[package]
name = "stryke-postgres"
version = "0.9.0"
description = "PostgreSQL client for stryke. cdylib loaded in-process — persistent postgres::Client per connection URL across calls."
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-postgres"
edition = "2026"

[ffi]
lib-name = "stryke_postgres"
namespace = "Postgres"
exports = [
    "pg__pkg_version",
    "pg__version",
    "pg__ping",
    "pg__databases",
    "pg__tables",
    "pg__schema",
    "pg__query",
    "pg__execute",
    "pg__exec",
    "pg__dump",
    "pg__insert_many",
    "pg__copy_in",
    "pg__copy_out",
    "pg__notify",
    "pg__listen",
    "pg__explain",
    "pg__views",
    "pg__functions",
    "pg__indexes",
    "pg__roles",
    "pg__db_size",
    "pg__activity",
    "pg__locks",
    "pg__table_size",
    "pg__sequences",
    "pg__extensions",
    "pg__triggers",
    "pg__cancel_backend",
    "pg__parse_dsn",
    "pg__build_dsn",
    "pg__quote_ident",
    "pg__quote_qualified_ident",
    "pg__parse_qualified_ident",
    "pg__quote_literal",
    "pg__unquote_literal",
    "pg__format_array",
    "pg__parse_array",
]

[scripts]
build = "cargo build --release"
build-debug = "cargo build"
clean = "cargo clean"
test = "s test t/"
install = "s pkg install -g ."
