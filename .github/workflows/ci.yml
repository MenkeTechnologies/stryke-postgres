name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --no-fail-fast

  helper-live-pg:
    name: Helper end-to-end (live Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stryke
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: stryke_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U stryke -d stryke_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      POSTGRES_DSN: postgres://stryke:secret@127.0.0.1:5432/stryke_test
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Wait for postgres ready
        run: |
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U stryke -d stryke_test >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "postgres never came up" >&2
          exit 1

      - name: Helper ping
        run: ./target/release/stryke-postgres-helper ping

      - name: Round-trip (write/read/schema/jsonb)
        run: |
          set -euo pipefail
          H=./target/release/stryke-postgres-helper
          $H execute 'CREATE TABLE ci_smoke (id SERIAL PRIMARY KEY, name TEXT, score DOUBLE PRECISION, data JSONB)' | jq -e '.affected_rows == 0'
          $H execute 'INSERT INTO ci_smoke (name, score, data) VALUES ($1, $2, $3)' --bind='["alice", 1.5, {"color":"blue"}]' | jq -e '.affected_rows == 1'
          $H execute 'INSERT INTO ci_smoke (name, score, data) VALUES ($1, $2, $3)' --bind='["bob",   2.5, {"color":"red"}]'  | jq -e '.affected_rows == 1'
          $H query 'SELECT name FROM ci_smoke WHERE score > $1::float8' --bind='[1.0]' --columnar | jq -e '.num_rows == 2'
          $H query 'SELECT data FROM ci_smoke WHERE name = $1' --bind='["alice"]' | jq -e '.data.color == "blue"'
          $H schema --table ci_smoke | jq -e '.columns | length == 4'
          $H tables | grep -q ci_smoke
          $H databases | grep -q stryke_test
          $H execute 'DROP TABLE ci_smoke' | jq -e 'has("affected_rows")'

  doc:
    name: Doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

  release-build:
    name: Release Build (${{ matrix.target }})
    needs: [check, test, helper-live-pg]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v6
        with:
          name: stryke-postgres-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/stryke-postgres-helper

  docs-gates:
    name: Docs gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/docs-target-blank-rel-noopener.sh
      - run: bash tests/docs-no-http-links.sh
      - run: bash tests/docs-no-inline-handlers.sh

  polish-gates:
    name: Polish gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/man-page-no-trailing-whitespace.sh
      - run: bash tests/man-page-final-newline.sh
      - run: bash tests/man-page-synopsis-section.sh
      - run: bash tests/tests-shell-executable.sh
      - run: bash tests/tests-shell-shebang.sh

  semantic-gates:
    name: Semantic gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/docs-has-h1.sh
      - run: bash tests/docs-no-deprecated-tags.sh
      - run: bash tests/docs-no-placeholder-href.sh

  newline-gates:
    name: Newline + README gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash tests/readme-final-newline.sh
      - run: bash tests/docs-final-newline.sh
      - run: bash tests/workflow-final-newline.sh
      - run: bash tests/cargo-final-newline.sh
      - run: bash tests/readme-has-https-link.sh
