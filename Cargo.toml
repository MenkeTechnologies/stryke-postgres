[package]
name = "stryke-postgres"
version = "0.3.3"
edition = "2021"
description = "PostgreSQL cdylib for the stryke `postgres` package — dlopened in-process via stryke's FFI bridge"
authors = ["MenkeTechnologies"]
license = "MIT"
repository = "https://github.com/MenkeTechnologies/stryke-postgres"
homepage = "https://menketechnologies.github.io/stryke-postgres/"
publish = false

[lib]
name = "stryke_postgres"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = "1"
once_cell = "1"
parking_lot = "0.12"
bytes = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
